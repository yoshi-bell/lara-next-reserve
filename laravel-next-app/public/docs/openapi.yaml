                      name: 志摩屋
                      area_id: 3
                      genre_id: 5
                      description: ラーメン屋とは思えない店内にはカウンター席はもちろん、個室も用意してあります。ラーメンはこってり系・あっあっさり系ともに揃っています。その他豊富な一品料理やアルコールも用意しており、居酒屋としても利用できます。ぜひご来店をお待ちしております。
                      image_url: /images/shops/ramen.jpg
                      start_time: "17:00:00"
                      end_time: "22:00:00"
                      default_capacity: 30
                      default_stay_time: 90
                      area:
                        id: 3
                        name: 福岡県
                      genre:
                        id: 5
                        name: ラーメン
                      favorites_exists: false
