                      name: 香
                      area_id: 1
                      genre_id: 2
                      description: 大小さまざまなお部屋をご用意してます。デートや接待、記念日や誕生日など特別な日にご利用ください。皆様のご来店をお待ちしております。
                      image_url: /images/shops/yakiniku.jpg
                      start_time: "16:00:00"
                      end_time: "23:00:00"
                      default_capacity: 10
                      default_stay_time: 120
                      area:
