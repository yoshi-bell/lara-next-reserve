openapi: 3.0.3
info:
  title: "lara-next-reserve API Documentation"
  description: ""
  version: 1.0.0
servers:
  - url: "http://localhost"
tags:
  - name: Endpoints
    description: ""
paths:
  /api/user:
    get:
      summary: ログイン中のユーザー情報を取得
      operationId: ""
      description: ""
      parameters: []
      responses:
        401:
          description: ""
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 認証されていません。
                properties:
                  message:
                    type: string
                    example: 認証されていません。
      tags:
        - Endpoints
      security: []
  /api/logout:
    post:
      summary: "ログアウト処理 (セッションの破棄)"
      operationId: ""
      description: ""
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/favorites:
    get:
      summary: お気に入り店舗一覧を取得
      operationId: ""
      description: ""
      parameters: []
      responses:
        401:
          description: ""
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 認証されていません。
                properties:
                  message:
                    type: string
                    example: 認証されていません。
      tags:
        - Endpoints
      security: []
  "/api/shops/{shop_id}/favorite":
    post:
      summary: お気に入りを登録
      operationId: ""
      description: ""
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
    delete:
      summary: お気に入りを解除
      operationId: ""
      description: ""
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
    parameters:
      - in: path
        name: shop_id
        description: "The ID of the shop."
        example: 1
        required: true
        schema:
          type: integer
  /api/reservations:
    get:
      summary: ログインユーザーの予約一覧を取得
      operationId: ""
      description: ""
      parameters: []
      responses:
        401:
          description: ""
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 認証されていません。
                properties:
                  message:
                    type: string
                    example: 認証されていません。
      tags:
        - Endpoints
      security: []
    post:
      summary: 予約を作成
      operationId: ""
      description: ""
      parameters: []
      responses: {}
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id:
                  type: string
                  description: "The <code>id</code> of an existing record in the shops table."
                  example: architecto
                start_at:
                  type: string
                  description: "valueは、正しい日付ではありません。 valueには、<code>now</code>より後の日付を指定してください。."
                  example: "2052-02-29"
                number:
                  type: integer
                  description: valueには、1以上の数値を指定してください。.
                  example: 22
              required:
                - shop_id
                - start_at
                - number
      security: []
  "/api/reservations/{reservation_id}":
    delete:
      summary: 予約を削除（キャンセル）
      operationId: ""
      description: ""
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
    parameters:
      - in: path
        name: reservation_id
        description: "The ID of the reservation."
        example: 1
        required: true
        schema:
          type: integer
  /api/shops:
    get:
      summary: 店舗一覧を取得（検索フィルタ対応）
      operationId: ""
      description: ""
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - id: 1
                      name: 仙人
                      area_id: 1
                      genre_id: 1
                      description: 料理長厳選の食材から作る寿司を用いたコースをぜひお楽しみください。食材・味・価格、お客様の満足度を徹底的に追及したお店です。特別な日のお食事、ビジネス接待まで気軽に使用することができます。
                      image_url: /images/shops/sushi.jpg
                      start_time: "17:00:00"
                      end_time: "22:00:00"
                      default_capacity: 40
                      default_stay_time: 60
                      area:
                        id: 1
                        name: 東京都
                      genre:
                        id: 1
                        name: 寿司
                      favorites_exists: false
                    - id: 2
                      name: 牛助
                      area_id: 2
                      genre_id: 2
                      description: 焼肉業界で20年間経験を積み、肉を熟知したマスターによる実力派焼肉店。長年の実績とお付き合いをもとに、なかなか食べられない希少部位も仕入れております。また、ゆったりとくつろげる空間はお仕事終わりの一杯や女子会にぴったりです。
                      image_url: /images/shops/yakiniku.jpg
                      start_time: "18:00:00"
                      end_time: "22:00:00"
                      default_capacity: 30
                      default_stay_time: 60
                      area:
                        id: 2
                        name: 大阪府
                      genre:
                        id: 2
                        name: 焼肉
                      favorites_exists: false
                    - id: 3
                      name: 戦慄
                      area_id: 3
                      genre_id: 4
                      description: 気軽に立ち寄れる昔懐かしの大衆居酒屋です。キンキンに冷えたビールを、なんと199円で。鳥かわ煮込み串は販売総数100000本突破の名物料理です。仕事帰りに是非御来店ください。
                      image_url: /images/shops/izakaya.jpg
                      start_time: "18:00:00"
                      end_time: "23:00:00"
                      default_capacity: 30
                      default_stay_time: 90
                      area:
                        id: 3
                        name: 福岡県
                      genre:
                        id: 4
                        name: 居酒屋
                      favorites_exists: false
