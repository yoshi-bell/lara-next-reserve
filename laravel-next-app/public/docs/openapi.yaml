                      name: ルーク
                      area_id: 1
                      genre_id: 3
                      description: 都心にひっそりとたたずむ、古民家を改築した落ち着いた空間です。イタリアで修業を重ねたシェフによるモダンなイタリア料理とソムリエセレクトによる厳選ワインとのペアリングが好評です。ゆっくりと上質な時間をお楽しみください。
                      image_url: /images/shops/italian.jpg
                      start_time: "17:00:00"
                      end_time: "22:00:00"
                      default_capacity: 40
                      default_stay_time: 90
                      area:
                        id: 1
                        name: 東京都
                      genre:
                        id: 3
                        name: イタリアン
                      favorites_exists: false
